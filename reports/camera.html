<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Камера</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#000;--ink:#fff;--muted:rgba(255,255,255,.7);--ok:#2f8a4e;--bad:#e5533d}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
video,#shot{width:100%;height:100%;object-fit:cover}
#shot{display:none;object-fit:contain}
.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 14px) 16px 28px;background:linear-gradient(rgba(0,0,0,.65),transparent);text-align:center}
.top b{display:block;font-size:16px}
.top small{color:var(--muted)}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:24px 16px calc(env(safe-area-inset-bottom) + 24px);background:linear-gradient(transparent,rgba(0,0,0,.7));display:flex;align-items:center;justify-content:center;gap:28px}
.shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);cursor:pointer;padding:0;transition:transform .08s}
.shutter:active{transform:scale(.92)}
.shutter:disabled{opacity:.4}
.btn{border:0;border-radius:12px;padding:14px 20px;font-weight:600;font-size:16px;cursor:pointer}
.btn.primary{background:#fff;color:#000;min-width:150px}
.btn.ghost{background:rgba(255,255,255,.15);color:#fff}
.hidden{display:none!important}
.msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;background:#000}
.msg .big{font-size:52px}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.8;transition:none}
.spin{width:22px;height:22px;border:3px solid rgba(0,0,0,.25);border-top-color:#000;border-radius:50%;animation:s 0.8s linear infinite;display:inline-block;vertical-align:-5px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="stage">
  <video id="video" autoplay playsinline muted></video>
  <img id="shot" alt="">
</div>
<div class="top"><b id="title">Фото</b><small id="sub">Наведи камеру й натисни кнопку</small></div>

<div class="bottom" id="liveBar">
  <button class="shutter" id="shutter" aria-label="Зробити фото" disabled></button>
</div>
<div class="bottom hidden" id="reviewBar">
  <button class="btn ghost" id="retake">Перезняти</button>
  <button class="btn primary" id="sendBtn">Надіслати</button>
</div>

<div class="msg hidden" id="msg"><div class="big" id="msgIcon"></div><div id="msgText"></div><button class="btn ghost hidden" id="msgBtn">Закрити</button></div>
<div class="flash" id="flash"></div>
<canvas id="canvas" class="hidden"></canvas>

<script>
const tg = window.Telegram?.WebApp;
const $ = (s) => document.getElementById(s);
const qs = new URLSearchParams(location.search);
const SUB = qs.get("s"), ITEM = qs.get("i");
const ENDPOINT = (window.CK_CONFIG?.url || "") + "/functions/v1/telegram-bot/photo?s=" + encodeURIComponent(SUB) + "&i=" + encodeURIComponent(ITEM);
const MAX_SIDE = 1600;
let stream, blob;

$("title").textContent = qs.get("t") || "Фото";

function showMsg(icon, text, closable = true) {
  $("msg").classList.remove("hidden"); $("msgIcon").textContent = icon; $("msgText").textContent = text;
  $("msgBtn").classList.toggle("hidden", !closable);
}
$("msgBtn").onclick = () => tg?.close();

async function start() {
  if (!tg || !tg.initData) return showMsg("📱", "Відкрий камеру кнопкою «📷 Зробити фото» в боті.");
  tg.ready(); tg.expand();
  try { tg.disableVerticalSwipes?.(); tg.setHeaderColor?.("#000000"); tg.setBackgroundColor?.("#000000"); } catch (e) {}
  if (!SUB || !ITEM || !window.CK_CONFIG?.url) return showMsg("⚠️", "Посилання некоректне. Повернись у бот.");
  if (!navigator.mediaDevices?.getUserMedia) return showMsg("⚠️", "Камера недоступна в цій версії Telegram. Онови застосунок.");
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false,
    });
    $("video").srcObject = stream;
    await $("video").play().catch(() => {});
    $("shutter").disabled = false;
  } catch (e) {
    showMsg("🚫", e.name === "NotAllowedError"
      ? "Немає доступу до камери. Дозволь Telegram користуватися камерою в налаштуваннях телефону й спробуй ще раз."
      : "Не вдалося увімкнути камеру: " + (e.message || e.name));
  }
}

$("shutter").onclick = () => {
  const v = $("video"); if (!v.videoWidth) return;
  const k = Math.min(1, MAX_SIDE / Math.max(v.videoWidth, v.videoHeight));
  const c = $("canvas"); c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
  const ctx = c.getContext("2d"); ctx.drawImage(v, 0, 0, c.width, c.height);
  // штамп часу знімка
  const ts = new Date().toLocaleString("uk-UA", { timeZone: "Europe/Kyiv", hour12: false });
  const fs = Math.round(c.width / 40);
  ctx.font = `600 ${fs}px sans-serif`; ctx.textBaseline = "bottom";
  const tw = ctx.measureText(ts).width;
  ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(c.width - tw - fs * 1.2, c.height - fs * 1.9, tw + fs * 0.8, fs * 1.5);
  ctx.fillStyle = "#fff"; ctx.fillText(ts, c.width - tw - fs * 0.8, c.height - fs * 0.6);
  $("flash").classList.add("on"); setTimeout(() => $("flash").classList.remove("on"), 60);
  tg?.HapticFeedback?.impactOccurred("medium");
  c.toBlob((b) => {
    blob = b; $("shot").src = URL.createObjectURL(b);
    $("shot").style.display = "block"; v.style.display = "none";
    $("liveBar").classList.add("hidden"); $("reviewBar").classList.remove("hidden");
    $("sub").textContent = "Перевір фото";
  }, "image/jpeg", 0.85);
};

$("retake").onclick = () => {
  blob = null; $("shot").style.display = "none"; $("video").style.display = "block";
  $("reviewBar").classList.add("hidden"); $("liveBar").classList.remove("hidden");
  $("sub").textContent = "Наведи камеру й натисни кнопку";
};

$("sendBtn").onclick = async () => {
  if (!blob) return;
  const b = $("sendBtn"); b.disabled = true; $("retake").disabled = true; b.innerHTML = '<span class="spin"></span>';
  try {
    const r = await fetch(ENDPOINT, { method: "POST", headers: { "content-type": "image/jpeg", "x-tg-init-data": tg.initData }, body: blob });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Помилка " + r.status);
    stream?.getTracks().forEach((t) => t.stop());
    tg?.HapticFeedback?.notificationOccurred("success");
    showMsg("✅", "Фото збережено", false);
    setTimeout(() => tg?.close(), 700);
  } catch (e) {
    tg?.HapticFeedback?.notificationOccurred("error");
    b.disabled = false; $("retake").disabled = false; b.textContent = "Надіслати";
    if (/не потрібне|не активний|недійсна/.test(e.message)) showMsg("ℹ️", e.message);
    else tg?.showAlert ? tg.showAlert(e.message) : alert(e.message);
  }
};

start();
</script>
</body>
</html>
